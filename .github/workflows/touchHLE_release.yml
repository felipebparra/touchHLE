
name: Build touchHLE Android

on:
  push:
    branches: ["trunk"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CFLAGS: "-std=gnu17"
  CMAKE_C_FLAGS: "-std=gnu17"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout modified touchHLE
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk@3.5.4

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0

      - name: Download Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o boost.7z \
            https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          mkdir -p vendor
          7z x boost.7z -ovendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: vendor/cmake
          key: cmake_3_31_6_linux

      - name: Download CMake
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o cmake.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          mkdir -p vendor
          tar xzf cmake.tar.gz -C vendor
          mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: gradle
          key: gradle-8.11.1

      - name: Download Gradle
        if: steps.cache-gradle.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          mkdir -p gradle
          unzip -q gradle.zip -d gradle

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk
          key: android-ndk-r25c

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          mkdir -p android-ndk
          unzip -q ndk.zip -d android-ndk

      - name: Configure Android NDK
        run: |
          NDK_PATH="$GITHUB_WORKSPACE/android-ndk/android-ndk-r25c"
          SDK_NDK="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          if [ ! -e "$SDK_NDK" ]; then
            mkdir -p "$(dirname "$SDK_NDK")"
            ln -s "$NDK_PATH" "$SDK_NDK"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Configure C compiler
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CFLAGS=-std=gnu17" >> "$GITHUB_ENV"
          echo "CMAKE_C_FLAGS=-std=gnu17" >> "$GITHUB_ENV"
          echo "CMAKE=$GITHUB_WORKSPACE/vendor/cmake/bin/cmake" >> "$GITHUB_ENV"

      - name: Build for Android
        run: |
          cd android
          ../gradle/gradle-8.11.1/bin/gradle assembleRelease
          mv app/build/outputs/apk/release/app-release.apk ../touchHLE.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: touchHLE_Android_AArch64
          path: touchHLE.apk
          if-no-files-found: error
